version: "3.9"

services:
  effect-debug:
    image: node:20-alpine
    container_name: effect-runtime-debug
    working_dir: /app
    ports:
      - "9229:9229"       # Node.js --inspect
      - "9230:9230"       # Additional inspector port
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--inspect=0.0.0.0:9229
      - EFFECT_TRACE_LEVEL=debug
      - EFFECT_FIBER_GC_INTERVAL=1000
      - EFFECT_DEADLOCK_TIMEOUT=5000
      - NODE_PENDING_DEPRECATION=1
      - NODE_DEBUG=effect
    volumes:
      - ./examples:/app/examples
      - ./heapdumps:/app/heapdumps
      - ./logs:/app/logs
    command: >
      sh -c "
        npm init -y &&
        npm install effect @effect/schema @effect/platform &&
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').createServer((req,res)=>{res.end('ok')}).listen(9230)"]
      interval: 10s
      timeout: 5s
      retries: 3
    cap_add:
      - SYS_RESOURCE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  heap-analyzer:
    image: node:20-alpine
    container_name: heap-analyzer
    working_dir: /app
    ports:
      - "9231:9231"
    environment:
      - NODE_ENV=development
    volumes:
      - ./heapdumps:/app/heapdumps
    command: >
      sh -c "
        npm install -g heapdump chrome-launcher &&
        tail -f /dev/null
      "
    depends_on:
      - effect-debug

  prometheus:
    image: prom/prometheus:latest
    container_name: effect-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - effect-debug

  grafana:
    image: grafana/grafana:latest
    container_name: effect-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
