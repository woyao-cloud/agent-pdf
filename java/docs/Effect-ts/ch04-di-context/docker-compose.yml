version: "3.9"
services:
  basic:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    command: sh -c "npm init -y && npm install @effect/platform@latest && npx tsx examples/01-basic/context-tag.ts"
  advanced:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    command: sh -c "npm init -y && npm install @effect/platform@latest && npx tsx examples/02-advanced/layer-composition.ts"
  production:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    command: sh -c "npm init -y && npm install @effect/platform@latest && npx tsx examples/03-production/di-architecture.ts"
