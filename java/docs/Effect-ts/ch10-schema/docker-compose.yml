version: "3.8"
services:
  schema-basic:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./examples/01-basic:/app/examples/01-basic
    command: >
      sh -c "npm install @effect/platform@latest @effect/schema@latest effect@latest &&
             npx tsx examples/01-basic/01-schema-definition.ts &&
             npx tsx examples/01-basic/02-parse-assert.ts &&
             npx tsx examples/01-basic/03-composing-schemas.ts"

  schema-advanced:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./examples/02-advanced:/app/examples/02-advanced
    command: >
      sh -c "npm install @effect/platform@latest @effect/schema@latest effect@latest &&
             npx tsx examples/02-advanced/01-ast-transformation.ts &&
             npx tsx examples/02-advanced/02-branded-types.ts &&
             npx tsx examples/02-advanced/03-filtered-schema.ts"

  schema-production:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./examples/03-production:/app/examples/03-production
    command: >
      sh -c "npm install @effect/platform@latest @effect/schema@latest effect@latest &&
             npx tsx examples/03-production/01-http-api-schema.ts &&
             npx tsx examples/03-production/02-json-api-validation.ts &&
             npx tsx examples/03-production/03-schema-evolution.ts"
