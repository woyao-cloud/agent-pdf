events {
  worker_connections 1024;
}

http {
  upstream im_backend {
    # Round-robin load balancing across two IM server instances
    server im-server:8080;
    server im-server-2:8080;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://im_backend;

      # WebSocket upgrade headers (RFC 6455)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Preserve original client information
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeout settings for long-lived WebSocket connections
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }
  }
}