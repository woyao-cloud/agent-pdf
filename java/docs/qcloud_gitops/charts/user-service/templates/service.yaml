apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-service.fullname" . }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
  annotations:
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: {{ .Values.service.annotations.subnetId | default "" }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "user-service.selectorLabels" . | nindent 4 }}
