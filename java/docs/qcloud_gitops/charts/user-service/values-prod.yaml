# 生产环境 values
replicaCount: 3

image:
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 2

env:
  LOG_LEVEL: INFO

persistence:
  enabled: true
  size: 1Gi
  storageClass: cbs-csi
