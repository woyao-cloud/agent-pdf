# 默认 values
replicaCount: 1

image:
  repository: your-dockerhub-user/user-service
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
  - host: user-service.local
    paths:
    - path: /
      pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: false
  minAvailable: 1

env:
  SERVICE_NAME: user-service
  DATABASE_URL: sqlite:///./data/users.db
  LOG_LEVEL: INFO

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}
