apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  application.yml: |
    server:
      port: 8080
    spring:
      datasource:
        url: jdbc:mysql://mysql-headless:3306/demo
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          idle-timeout: 300000
      redis:
        host: redis-headless
        port: 6379
        timeout: 3000
    app:
      feature-flags:
        new-payment-flow: true
        dark-launch: false
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: production
type: Opaque
data:
  # echo -n "my-password" | base64
  db-password: bXktcGFzc3dvcmQ=
  redis-password: cmVkaXMtcGFzcw==
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: production
spec:
  containers:
  - name: app
    image: ccr.ccs.tencentyun.com/demo/app:1.0.0
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: "production"
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: db-password
    volumeMounts:
    - name: config
      mountPath: /app/config
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: app-config
