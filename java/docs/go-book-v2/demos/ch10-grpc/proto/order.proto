syntax = "proto3";
package order;
option go_package = "go-book/demo/grpc/pb;pb";

// OrderService 订单服务定义
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

// StockService 库存服务定义
service StockService {
  rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
}

message CreateOrderRequest { string user_id = 1; string product_id = 2; int32 quantity = 3; }
message CreateOrderResponse { string order_id = 1; bool success = 2; }
message GetOrderRequest { string order_id = 1; }
message GetOrderResponse { string order_id = 1; string status = 2; }
message DeductStockRequest { string product_id = 1; int32 quantity = 2; }
message DeductStockResponse { bool success = 1; }