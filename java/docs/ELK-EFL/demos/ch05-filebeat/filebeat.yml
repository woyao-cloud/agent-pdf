# ============================================
# Filebeat —— 采集 JSON 日志到 Elasticsearch
# ============================================

filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/apps/*.json.log

output.elasticsearch:
  hosts: ["es-node1:9200"]
  index: "app-logs-%{+yyyy.MM.dd}"

setup.template.enabled: false

logging.level: info