# ============================================
# Fluent Bit —— 容器日志采集（第7章）
# ============================================
# 用法：docker compose -f ch07-fluentbit/docker-compose.yml up -d
# ============================================

[SERVICE]
    flush                    1
    log_level                info
    storage.path             /fluent-bit/output
    storage.sync             normal
    storage.backlog.mem_limit 50M
    HTTP_Server              On
    HTTP_Listen              0.0.0.0
    HTTP_Port                2020

[INPUT]
    Name              tail
    Tag               app.*
    Path              /var/log/apps/*.json.log
    Parser            json
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[PARSER]
    Name        json
    Format      json
    Time_Key    @timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[FILTER]
    Name  modify
    Match app.*
    Remove stream
    Rename log message

[OUTPUT]
    Name                es
    Match               app.*
    Host                ${ES_HOST}
    Port                ${ES_PORT}
    Index               app-logs-%Y.%m.%d
    Type                _doc
    Generate_ID         On
    Buffer_Size         1MB
    Retry_Limit         6