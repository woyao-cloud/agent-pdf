# ============================================
# Logstash Pipeline —— 日志处理
# ============================================
# 功能：从 Kafka 消费日志，脱敏，写入 ES
# ============================================

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["app-logs"]
    group_id => "logstash-elk"
    codec => "json"
    consumer_threads => 1
    auto_offset_reset => "latest"
  }
}

filter {
  mutate {
    gsub => [
      "message", "(1[3-9]\\d)\\d{4}(\\d{4})", "\\1****\\2"
    ]
  }
}

output {
  if [level] == "ERROR" or [level] == "WARN" {
    elasticsearch {
      hosts => ["es-node1:9200"]
      index => "app-logs-error-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["es-node1:9200"]
      index => "app-logs-%{+YYYY.MM.dd}"
    }
  }
}