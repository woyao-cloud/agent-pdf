# ============================================
# Logstash Pipeline —— 日志处理
# ============================================
# 输入1: app-logs（通用应用日志 → app-logs-* 索引）
# 输入2: audit-logs（审计日志 → audit-logs-* 索引，只读保护）
# ============================================

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["app-logs"]
    group_id => "logstash-elk"
    codec => "json"
    consumer_threads => 1
    auto_offset_reset => "latest"
  }

  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["audit-logs"]
    group_id => "logstash-audit"
    codec => "json"
    consumer_threads => 1
    auto_offset_reset => "latest"
  }
}

filter {
  # ===== 审计日志：检测到 action 字段则走审计通道 =====
  if [action] {
    mutate {
      add_field => { "[@metadata][index_type]" => "audit" }
    }
  }

  # ===== 通用日志：手机号脱敏 =====
  if ![action] {
    mutate {
      gsub => [
        "message", "(1[3-9]\\d)\\d{4}(\\d{4})", "\\1****\\2"
      ]
    }
  }
}

output {
  # ===== 审计日志 → 独立索引（只读保护） =====
  if [@metadata][index_type] == "audit" {
    elasticsearch {
      hosts => ["es-node1:9200"]
      index => "audit-logs-%{+YYYY.MM.dd}"
    }
  }
  # ===== ERROR/WARN → 错误索引 =====
  else if [level] == "ERROR" or [level] == "WARN" {
    elasticsearch {
      hosts => ["es-node1:9200"]
      index => "app-logs-error-%{+YYYY.MM.dd}"
    }
  }
  # ===== 通用日志 → 主索引 =====
  else {
    elasticsearch {
      hosts => ["es-node1:9200"]
      index => "app-logs-%{+YYYY.MM.dd}"
    }
  }
}