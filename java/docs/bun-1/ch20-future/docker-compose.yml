version: "3.8"
services:
  bun:
    image: oven/bun:latest
    container_name: bun-ch20
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo '=== Bun Version ===' &&
      bun --version &&
      echo '=== 01-basic: WinterCG Check ===' &&
      bun run examples/01-basic/wintercg-check.ts &&
      echo '=== 02-advanced: RSC Demo ===' &&
      bun run examples/02-advanced/rsc-demo.ts &&
      echo '=== 03-production: Edge Function ===' &&
      bun run examples/03-production/edge-function.ts
      "
