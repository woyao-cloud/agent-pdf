version: "3.8"
services:
  bun:
    image: oven/bun:latest
    container_name: bun-ch11
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo '=== Bun Version ===' &&
      bun --version &&
      echo '' &&
      echo '=== 01-basic: Engine Benchmark ===' &&
      bun run examples/01-basic/engine-bench.ts &&
      echo '' &&
      echo '=== 02-advanced: JIT Analysis ===' &&
      bun run examples/02-advanced/jit-analysis.ts &&
      echo '' &&
      echo '=== 03-production: Memory Profile ===' &&
      bun run examples/03-production/memory-profile.ts
