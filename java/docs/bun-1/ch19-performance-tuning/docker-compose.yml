version: "3.8"
services:
  bun:
    image: oven/bun:latest
    container_name: bun-ch19
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo '=== Bun Version ===' &&
      bun --version &&
      echo '=== 01-basic: Memory Profiling ===' &&
      bun run examples/01-basic/memory-profile.ts &&
      echo '=== 02-advanced: CPU Benchmark ===' &&
      bun run examples/02-advanced/cpu-bench.ts &&
      echo '=== 03-production: OpenTelemetry Tracing ===' &&
      bun run examples/03-production/otel-tracing.ts
      "
