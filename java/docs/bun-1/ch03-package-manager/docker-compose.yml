version: "3.8"
services:
  bun:
    image: oven/bun:latest
    container_name: bun-ch03
    working_dir: /app
    volumes:
      - ./examples:/app/examples
      - bun-cache:/root/.bun
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo '=== bun install speed test ===' &&
      mkdir -p /tmp/test-install &&
      cd /tmp/test-install &&
      echo '{"name":"test","dependencies":{"express":"*"}}' > package.json &&
      echo 'First install (cold cache):' &&
      time bun install 2>&1 &&
      echo '' &&
      echo 'Second install (warm cache):' &&
      time bun install 2>&1 &&
      echo '' &&
      echo '=== Workspace Demo ===' &&
      bun run /app/examples/01-basic/workspace-demo.ts &&
      echo '' &&
      echo '=== Cache inspection ===' &&
      ls -la /root/.bun/install/cache/ | head -5

volumes:
  bun-cache:
