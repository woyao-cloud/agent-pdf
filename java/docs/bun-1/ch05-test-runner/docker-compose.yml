version: "3.8"
services:
  bun:
    image: oven/bun:latest
    container_name: bun-ch05
    working_dir: /app
    volumes:
      - ./examples:/app/examples
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo '=== 01-basic: Unit Tests ===' &&
      bun test examples/01-basic/ 2>&1 | head -40 &&
      echo '' &&
      echo '=== 02-advanced: Mock & Spy ===' &&
      bun test examples/02-advanced/ 2>&1 | head -40 &&
      echo '' &&
      echo '=== 03-production: API Integration Tests ===' &&
      bun test examples/03-production/ 2>&1 | head -50
