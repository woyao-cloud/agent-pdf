global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - 'rules/alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'alert-generator'
    static_configs:
      - targets: ['alert-generator:8088']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']