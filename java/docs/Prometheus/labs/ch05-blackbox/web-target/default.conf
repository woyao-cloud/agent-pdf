server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /slow {
        limit_rate 1k;
        return 200 "slow response\n";
    }

    location = /redirect {
        return 302 /health;
    }
}