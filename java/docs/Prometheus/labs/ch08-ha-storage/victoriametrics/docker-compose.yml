version: '3.8'

services:
  # VictoriaMetrics 单节点
  victoriametrics:
    image: victoriametrics/victoriaMetrics:v1.93.0
    container_name: prom-vm
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=30d'
    volumes:
      - vm_data:/storage
    ports:
      - "8428:8428"   # VM HTTP API
      - "2003:2003"   # Graphite 端口（可选）
    networks:
      - vm-net

  # Prometheus 源实例（通过 Remote Write 发送数据到 VM）
  prometheus-source:
    image: prom/prometheus:v2.48.0
    container_name: prom-vm-source
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'  # 源实例只保留 1h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_vm_source:/prometheus
    ports:
      - "9100:9090"
    depends_on:
      - victoriametrics
    networks:
      - vm-net

  # Grafana（数据源指向 VM）
  grafana:
    image: grafana/grafana:10.2.0
    container_name: prom-grafana-vm
    ports:
      - "3009:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data_vm:/var/lib/grafana
    depends_on:
      - victoriametrics
    networks:
      - vm-net

networks:
  vm-net:
    driver: bridge

volumes:
  vm_data:
  prometheus_data_vm_source:
  grafana_data_vm: