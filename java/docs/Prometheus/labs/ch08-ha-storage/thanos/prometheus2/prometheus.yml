global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'demo-app'
    static_configs:
      - targets: ['localhost:9090']
    metric_relabel_configs:
      - source_labels: [instance]
        regex: '.*'
        target_label: region
        replacement: 'eu-west'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']