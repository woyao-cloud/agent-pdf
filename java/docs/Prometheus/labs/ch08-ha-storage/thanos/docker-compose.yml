version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2023-01-12T02-51-47Z
    container_name: prom-minio
    entrypoint: sh
    command: -c 'mkdir -p /data/thanos && minio server /data --console-address ":9001"'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - thanos_minio_data:/data
    networks:
      - thanos-net

  prometheus1:
    image: prom/prometheus:v2.48.0
    container_name: prom-thanos-1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus1/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_thanos1:/prometheus
    ports:
      - "9098:9090"
    networks:
      - thanos-net

  thanos-sidecar-1:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: prom-thanoscar-1
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus1:9090
      - --objstore.config=bucket: "thanos"\\nendpoint: "minio:9000"\\naccess_key: "minioadmin"\\nsecret_key: "minioadmin"\\ninsecure: true\\n
    volumes:
      - prometheus_data_thanos1:/prometheus:ro
    depends_on:
      - minio
      - prometheus1
    networks:
      - thanos-net

  prometheus2:
    image: prom/prometheus:v2.48.0
    container_name: prom-thanos-2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus2/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_thanos2:/prometheus
    ports:
      - "9099:9090"
    networks:
      - thanos-net

  thanos-sidecar-2:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: prom-thanoscar-2
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus2:9090
      - --objstore.config=bucket: "thanos"\\nendpoint: "minio:9000"\\naccess_key: "minioadmin"\\nsecret_key: "minioadmin"\\ninsecure: true\\n
    volumes:
      - prometheus_data_thanos2:/prometheus:ro
    depends_on:
      - minio
      - prometheus2
    networks:
      - thanos-net

  thanos-store-gateway:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: prom-thanostore
    command:
      - store
      - --objstore.config=bucket: "thanos"\\nendpoint: "minio:9000"\\naccess_key: "minioadmin"\\nsecret_key: "minioadmin"\\ninsecure: true\\n
      - --data-dir=/data
    ports:
      - "10901:10901"
    depends_on:
      - minio
    networks:
      - thanos-net

  thanos-query:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: prom-thanoquery
    command:
      - query
      - --store=thanos-sidecar-1:10902
      - --store=thanos-sidecar-2:10902
      - --store=thanos-store-gateway:10901
    ports:
      - "10902:10902"
    depends_on:
      - thanos-sidecar-1
      - thanos-sidecar-2
      - thanos-store-gateway
    networks:
      - thanos-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: prom-grafana-ch08
    ports:
      - "3008:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - grafana_data_ch08:/var/lib/grafana
    depends_on:
      - thanos-query
    networks:
      - thanos-net

networks:
  thanos-net:
    driver: bridge

volumes:
  prometheus_data_thanos1:
  prometheus_data_thanos2:
  thanos_minio_data:
  grafana_data_ch08: