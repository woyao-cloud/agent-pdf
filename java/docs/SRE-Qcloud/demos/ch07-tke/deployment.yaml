apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-app
  namespace: production
  labels:
    app: sre-demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sre-demo-app
  template:
    metadata:
      labels:
        app: sre-demo-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - sre-demo-app
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: app
        image: ccr.ccs.tencentyun.com/demo/sre-app:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sre-demo-app
  namespace: production
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: sre-demo-app
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-demo-app-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sre-demo-app
