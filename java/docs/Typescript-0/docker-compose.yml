version: "3.9"
services:
  ts-dev:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: sh -c "
      npm init -y &&
      npm install typescript @types/node tsx &&
      npx tsc --init &&
      tail -f /dev/null
    "
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
