apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-cm
  namespace: argocd
data:
  config: |
    registries:
    - name: ECR
      api_url: https://$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      credentials: ext:/app/.ecr-credentials
      default: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-image-updater
  template:
    metadata:
      labels:
        app: argocd-image-updater
    spec:
      serviceAccountName: argocd-image-updater
      containers:
      - name: image-updater
        image: quay.io/argoprojlabs/argocd-image-updater:v0.14.0
        args:
        - run
        env:
        - name: AWS_REGION
          value: us-east-1
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: argocd-image-updater-cm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  applications: |
    - appName: demo-app
      match: |
        - image: $ECR_REGISTRY/demo-app
          updateStrategy: semver
          constraint:
            allowRegex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
