apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token
    username: ArgoCD Bot

  template.app-sync-succeeded: |
    message: |
      应用 {{.app.metadata.name}} 同步成功
      环境: {{.app.spec.destination.namespace}}
      版本: {{.app.status.sync.revision | substr 0 8}}

  template.app-sync-failed: |
    message: |
      ❌ 应用 {{.app.metadata.name}} 同步失败
      环境: {{.app.spec.destination.namespace}}
      错误: {{.app.status.operationState.message}}

  template.app-health-degraded: |
    message: |
      ⚠️ 应用 {{.app.metadata.name}} 健康状态降级
      环境: {{.app.spec.destination.namespace}}
      状态: {{.app.status.health.status}}

  trigger.on-sync-succeeded: |
    - description: Application sync succeeded
      send:
      - app-sync-succeeded
      when: app.status.sync.status == 'Synced'

  trigger.on-sync-failed: |
    - description: Application sync failed
      send:
      - app-sync-failed
      when: app.status.operationState.phase == 'Error'

  trigger.on-health-degraded: |
    - description: Application health degraded
      send:
      - app-health-degraded
      when: app.status.health.status == 'Degraded'

  trigger.on-deployed: |
    - description: Application deployed
      send:
      - app-sync-succeeded
      when: app.status.health.status == 'Healthy'
