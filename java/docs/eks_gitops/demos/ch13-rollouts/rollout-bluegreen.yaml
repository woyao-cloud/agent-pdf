apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app-bluegreen
  namespace: demo-prod
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: app
        image: public.ecr.aws/demo/app:v1.0.0
        ports:
        - containerPort: 8080
  strategy:
    blueGreen:
      activeService: demo-app-active
      previewService: demo-app-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 600
      prePromotionAnalysis:
        templates:
        - templateName: success-rate
        args:
        - name: service-name
          value: demo-app-preview
