version: "3.8"

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-integration
    ports:
      - "7483:7474"
      - "7696:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-integration-data:/data
      - ./init.cypher:/init.cypher

  app:
    build: ./app
    container_name: neo4j-app
    ports:
      - "5000:5000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    depends_on:
      - neo4j
    volumes:
      - ./app:/app

volumes:
  neo4j-integration-data:
