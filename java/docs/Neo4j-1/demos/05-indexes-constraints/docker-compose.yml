version: "3.8"

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-indexes
    ports:
      - "7478:7474"
      - "7691:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-indexes-data:/data
      - ./init.cypher:/init.cypher

volumes:
  neo4j-indexes-data:
