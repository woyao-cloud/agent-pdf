version: "3.8"

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-deepseek
    ports:
      - "7484:7474"
      - "7697:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-deepseek-data:/data
      - ./init.cypher:/init.cypher

  app:
    build: ./app
    container_name: neo4j-deepseek-app
    ports:
      - "5001:5000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-your-api-key-here}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - DEEPSEEK_MODEL=deepseek-chat
    depends_on:
      - neo4j
    volumes:
      - ./app:/app

volumes:
  neo4j-deepseek-data:
