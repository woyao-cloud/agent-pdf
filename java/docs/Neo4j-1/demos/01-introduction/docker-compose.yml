version: "3.8"

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-intro
    ports:
      - "7474:7474"   # HTTP - Neo4j Browser
      - "7687:7687"   # Bolt - 驱动连接
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-intro-data:/data
      - ./init.cypher:/init.cypher

volumes:
  neo4j-intro-data:
