version: "3.8"

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-cypher-basics
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-cypher-data:/data
      - ./init.cypher:/init.cypher

volumes:
  neo4j-cypher-data:
