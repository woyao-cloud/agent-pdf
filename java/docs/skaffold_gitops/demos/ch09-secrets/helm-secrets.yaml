# Helm Secrets + SOPS 配置
# 1. 安装 helm-secrets 插件
# helm plugin install https://github.com/jkroepke/helm-secrets

# 2. 创建加密的 values 文件
# sops --encrypt values-prod.yaml > values-prod.enc.yaml

# 3. 使用加密 values 部署
# helm secrets upgrade demo-app ./charts/demo-app \
#   -f secrets://values-prod.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: demo-app-prod
type: Opaque
stringData:
  # 这些值在 Git 中加密存储
  DB_PASSWORD: ""  # sops 加密
  API_KEY: ""      # sops 加密
