version: '3.8'

services:
  push-server:
    build: ./push-app
    container_name: prom-push-server
    ports:
      - "5000:5000"
    networks:
      - ch01-net

  pull-app:
    build: ./pull-app
    container_name: prom-pull-app
    ports:
      - "8080:8080"
    networks:
      - ch01-net

  statsd-exporter:
    image: prom/statsd-exporter:v0.25.0
    container_name: prom-statsd-exporter
    ports:
      - "9102:9102"
      - "9125:9125/udp"
    networks:
      - ch01-net

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prom-ch01
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_ch01:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pull-app
      - statsd-exporter
    networks:
      - ch01-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: prom-grafana-ch01
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data_ch01:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ch01-net

networks:
  ch01-net:
    driver: bridge

volumes:
  prometheus_data_ch01:
  grafana_data_ch01:
