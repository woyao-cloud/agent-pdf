global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Pull 模型核心示例：Pull App
  - job_name: 'pull-app'
    static_configs:
      - targets: ['pull-app:8080']

  # StatsD Exporter（Push-to-Pull 桥接）
  - job_name: 'statsd-exporter'
    static_configs:
      - targets: ['statsd-exporter:9102']

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
